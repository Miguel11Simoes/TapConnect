<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cartão TapConnect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<style>
  /* Layout: single centred card over a soft gradient field; identity = indigo -> teal. */
  :root{
    --bg:#eef1f8; --field1:#e9ecf8; --field2:#e6f5f1;
    --card:#ffffff; --fg:#14161b; --muted:#5b6070; --line:#e4e7f0;
    --brand1:#4f46e5; --brand2:#0d9488; --chip:#f3f4fb; --ring:rgba(79,70,229,.25);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0d0f14; --field1:#101320; --field2:#0d1a19;
      --card:#171a21; --fg:#e8eaf1; --muted:#aab0c0; --line:#2a2f3b;
      --brand1:#8c92ff; --brand2:#4fd6c4; --chip:#20242f; --ring:rgba(140,146,255,.3);
      color-scheme:dark;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:Poppins,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    color:var(--fg);
    background:
      radial-gradient(1200px 500px at 15% -10%, var(--field1), transparent 60%),
      radial-gradient(1000px 500px at 110% 10%, var(--field2), transparent 55%),
      var(--bg);
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding:max(20px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
  }
  .card{
    width:100%; max-width:430px; background:var(--card);
    border:1px solid var(--line); border-radius:26px; overflow:hidden;
    box-shadow:0 24px 60px -24px rgba(20,22,40,.35);
  }
  .top{
    background:linear-gradient(135deg,var(--brand1),var(--brand2));
    padding:34px 26px 58px; color:#fff; position:relative;
  }
  .eyebrow{font-size:13px; letter-spacing:.12em; text-transform:uppercase; opacity:.85; font-weight:500}
  .avatar{
    position:absolute; left:26px; bottom:-34px; width:84px; height:84px; border-radius:50%;
    background:rgba(255,255,255,.18); border:3px solid var(--card);
    display:flex; align-items:center; justify-content:center;
    font-size:30px; font-weight:600; color:#fff; backdrop-filter:blur(2px);
  }
  .body{padding:48px 26px 26px}
  h1{margin:0; font-size:26px; font-weight:600; line-height:1.15; text-wrap:balance}
  .role{margin:6px 0 0; color:var(--muted); font-size:15px}
  .loc{margin:4px 0 0; color:var(--muted); font-size:14px; display:flex; align-items:center; gap:6px}
  .rows{margin:22px 0 0; display:flex; flex-direction:column; gap:10px}
  .row{
    display:flex; align-items:center; gap:14px; text-decoration:none; color:var(--fg);
    padding:12px 14px; border:1px solid var(--line); border-radius:14px; background:transparent;
    transition:border-color .15s, transform .05s;
  }
  .row:hover{border-color:var(--brand1)}
  .row:active{transform:scale(.995)}
  .ic{
    width:38px; height:38px; flex:0 0 38px; border-radius:11px; background:var(--chip);
    display:flex; align-items:center; justify-content:center; color:var(--brand1);
  }
  .ic svg{width:20px; height:20px}
  .rlabel{font-size:12px; color:var(--muted)}
  .rvalue{font-size:15px; font-weight:500; word-break:break-word}
  .save{
    margin:24px 0 6px; width:100%; border:0; cursor:pointer;
    background:linear-gradient(135deg,var(--brand1),var(--brand2)); color:#fff;
    font-family:inherit; font-size:16px; font-weight:600; padding:16px; border-radius:16px;
    display:flex; align-items:center; justify-content:center; gap:10px;
    box-shadow:0 10px 24px -10px var(--ring);
  }
  .save:active{transform:translateY(1px)}
  .foot{margin:18px 0 0; text-align:center; font-size:13px; color:var(--muted)}
  .foot a{color:var(--brand1); text-decoration:none; font-weight:500}
  .empty{padding:40px 26px; text-align:center}
  .empty h1{font-size:22px}
  .empty p{color:var(--muted); font-size:15px; margin:10px 0 22px}
  svg{display:block}
</style>
</head>
<body>
  <main class="card" id="card" hidden>
    <div class="top">
      <div class="eyebrow">TapConnect</div>
      <div class="avatar" id="avatar">?</div>
    </div>
    <div class="body">
      <h1 id="name">—</h1>
      <p class="role" id="role" hidden></p>
      <p class="loc" id="loc" hidden>
        <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7Zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5Z"/></svg>
        <span id="locText"></span>
      </p>
      <div class="rows" id="rows"></div>
      <button class="save" id="save">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2Z"/></svg>
        Guardar contacto
      </button>
      <p class="foot">Cartão digital via <a href="./">TapConnect</a></p>
    </div>
  </main>

  <main class="card empty" id="empty" hidden>
    <div class="top"><div class="eyebrow">TapConnect</div></div>
    <div class="empty">
      <h1>Cartão vazio</h1>
      <p>Este link não traz dados de contacto. Aproxima o telemóvel de novo, ou instala a app para criares o teu cartão.</p>
      <a class="save" href="./" style="text-decoration:none">Abrir TapConnect</a>
    </div>
  </main>

<script>
const ICONS = {
  phone:'<path d="M6.6 10.8a15.5 15.5 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.24 11.4 11.4 0 0 0 3.6.58 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1 11.4 11.4 0 0 0 .58 3.6 1 1 0 0 1-.25 1l-2.23 2.2Z"/>',
  email:'<path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2Zm0 4-8 5-8-5V6l8 5 8-5v2Z"/>',
  link:'<path d="M3.9 12a3.1 3.1 0 0 1 3.1-3.1h4V7H7a5 5 0 0 0 0 10h4v-1.9H7A3.1 3.1 0 0 1 3.9 12ZM17 7h-4v1.9h4a3.1 3.1 0 0 1 0 6.2h-4V17h4a5 5 0 0 0 0-10Zm-9 4h8v2H8v-2Z"/>',
  linkedin:'<path d="M6.94 7A1.94 1.94 0 1 1 5 5.06 1.94 1.94 0 0 1 6.94 7ZM5.3 8.5h3.3V20H5.3Zm5.2 0h3.16v1.57h.05a3.47 3.47 0 0 1 3.12-1.71c3.34 0 3.96 2.2 3.96 5.05V20h-3.3v-5.1c0-1.22 0-2.78-1.7-2.78s-1.95 1.32-1.95 2.69V20h-3.3Z"/>',
  github:'<path d="M12 2a10 10 0 0 0-3.16 19.49c.5.09.68-.22.68-.48v-1.7c-2.78.6-3.37-1.34-3.37-1.34-.45-1.16-1.1-1.47-1.1-1.47-.9-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.9 1.52 2.34 1.08 2.91.83.09-.65.35-1.08.63-1.33-2.22-.25-4.56-1.11-4.56-4.95 0-1.09.39-1.98 1.03-2.68-.1-.26-.45-1.28.1-2.66 0 0 .84-.27 2.75 1.02a9.56 9.56 0 0 1 5 0c1.9-1.29 2.74-1.02 2.74-1.02.55 1.38.2 2.4.1 2.66.64.7 1.03 1.59 1.03 2.68 0 3.85-2.34 4.7-4.57 4.94.36.31.68.92.68 1.85v2.74c0 .27.18.58.69.48A10 10 0 0 0 12 2Z"/>',
  x:'<path d="M17.53 3H20l-5.44 6.21L21 21h-5.1l-4-5.25L7.3 21H4.8l5.82-6.64L3.4 3h5.23l3.62 4.78L17.53 3Zm-.9 16.2h1.4L7.44 4.72H5.95L16.63 19.2Z"/>',
  instagram:'<path d="M12 7.3A4.7 4.7 0 1 0 16.7 12 4.71 4.71 0 0 0 12 7.3Zm0 7.75A3.05 3.05 0 1 1 15.05 12 3.05 3.05 0 0 1 12 15.05ZM16.9 6a1.1 1.1 0 1 0 1.1 1.1A1.1 1.1 0 0 0 16.9 6ZM20.8 7.1a5.76 5.76 0 0 0-1.58-4.07A5.78 5.78 0 0 0 15.15 1.2C13.6 1.11 8.4 1.11 6.85 1.2A5.76 5.76 0 0 0 2.78 2.78 5.75 5.75 0 0 0 1.2 6.85C1.11 8.4 1.11 13.6 1.2 15.15a5.76 5.76 0 0 0 1.58 4.07 5.78 5.78 0 0 0 4.07 1.58c1.55.09 6.75.09 8.3 0a5.76 5.76 0 0 0 4.07-1.58 5.78 5.78 0 0 0 1.58-4.07c.09-1.55.09-6.74 0-8.29Zm-2.06 9.95a3.09 3.09 0 0 1-1.74 1.74c-1.2.48-4.06.37-5.4.37s-4.19.1-5.39-.37a3.09 3.09 0 0 1-1.74-1.74c-.48-1.2-.37-4.06-.37-5.4s-.1-4.19.37-5.39A3.09 3.09 0 0 1 6.6 4.92c1.2-.48 4.06-.37 5.4-.37s4.19-.1 5.39.37a3.09 3.09 0 0 1 1.74 1.74c.48 1.2.37 4.06.37 5.4s.11 4.2-.37 5.39Z"/>',
  facebook:'<path d="M22 12a10 10 0 1 0-11.56 9.88v-6.99H7.9V12h2.54V9.8c0-2.5 1.49-3.89 3.77-3.89 1.1 0 2.24.2 2.24.2v2.46h-1.26c-1.24 0-1.63.77-1.63 1.56V12h2.78l-.44 2.89h-2.34v6.99A10 10 0 0 0 22 12Z"/>',
  tiktok:'<path d="M16.5 3c.3 2.1 1.5 3.4 3.5 3.6v2.4c-1.2.1-2.4-.2-3.5-.8v5.9a5.6 5.6 0 1 1-5.6-5.6c.3 0 .6 0 .9.1v2.5a3.1 3.1 0 1 0 2.2 3V3h2.6Z"/>',
  youtube:'<path d="M23 12s0-3.2-.4-4.7a2.5 2.5 0 0 0-1.76-1.77C19.3 5.1 12 5.1 12 5.1s-7.3 0-8.84.42A2.5 2.5 0 0 0 1.4 7.3C1 8.8 1 12 1 12s0 3.2.4 4.7a2.5 2.5 0 0 0 1.76 1.77C4.7 18.9 12 18.9 12 18.9s7.3 0 8.84-.42a2.5 2.5 0 0 0 1.76-1.77C23 15.2 23 12 23 12ZM9.9 15.1V8.9l5.4 3.1-5.4 3.1Z"/>',
  web:'<path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2Zm6.9 6h-2.5a15.6 15.6 0 0 0-1-3.2A8 8 0 0 1 18.9 8ZM12 4a13.5 13.5 0 0 1 1.5 4h-3A13.5 13.5 0 0 1 12 4ZM4.3 14a7.8 7.8 0 0 1 0-4h2.9a16.9 16.9 0 0 0 0 4Zm.8 2h2.5a15.6 15.6 0 0 0 1 3.2A8 8 0 0 1 5.1 16Zm2.5-8H5.1a8 8 0 0 1 3.5-3.2 15.6 15.6 0 0 0-1 3.2ZM12 20a13.5 13.5 0 0 1-1.5-4h3A13.5 13.5 0 0 1 12 20Zm1.8-6h-3.6a14.7 14.7 0 0 1 0-4h3.6a14.7 14.7 0 0 1 0 4Zm.6 5.2a15.6 15.6 0 0 0 1-3.2h2.5a8 8 0 0 1-3.5 3.2Zm2.4-5.2a16.9 16.9 0 0 0 0-4h2.9a7.8 7.8 0 0 1 0 4Z"/>',
};

function iconFor(label){
  const l = (label||'').toLowerCase();
  if(l.includes('linkedin')) return 'linkedin';
  if(l.includes('github')) return 'github';
  if(l.includes('twitter')||l==='x'||l.includes('x /')||l.includes('x/')) return 'x';
  if(l.includes('instagram')) return 'instagram';
  if(l.includes('facebook')) return 'facebook';
  if(l.includes('tiktok')) return 'tiktok';
  if(l.includes('youtube')) return 'youtube';
  if(l.includes('site')||l.includes('web')) return 'web';
  return 'link';
}

function b64urlDecode(s){
  s = s.replace(/-/g,'+').replace(/_/g,'/');
  while(s.length % 4) s += '=';
  const bin = atob(s);
  const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
  return new TextDecoder().decode(bytes);
}

function initials(name){
  const parts = (name||'').trim().split(/\s+/).filter(Boolean).slice(0,2);
  return parts.map(p => p[0].toUpperCase()).join('') || '?';
}

function normUrl(v){
  if(/^(https?:|tel:|mailto:)/i.test(v)) return v;
  if(v.includes('@') && !v.includes('/')) return 'mailto:' + v;
  return 'https://' + v;
}

function row({icon, label, value, href}){
  const a = document.createElement('a');
  a.className = 'row';
  a.href = href;
  if(/^https?:/i.test(href)){ a.target = '_blank'; a.rel = 'noopener'; }
  a.innerHTML =
    `<span class="ic"><svg viewBox="0 0 24 24" fill="currentColor">${ICONS[icon]||ICONS.link}</svg></span>`+
    `<span><span class="rlabel">${label}</span><br><span class="rvalue"></span></span>`;
  a.querySelector('.rvalue').textContent = value;
  return a;
}

function vcard(p){
  const esc = s => (s||'').replace(/([,;\\])/g,'\\$1');
  let v = 'BEGIN:VCARD\r\nVERSION:3.0\r\n';
  v += 'FN:' + esc(p.n) + '\r\n';
  if(p.c || p.t){ v += 'ORG:' + esc(p.c) + '\r\nTITLE:' + esc(p.t) + '\r\n'; }
  if(p.p) v += 'TEL;TYPE=CELL:' + esc(p.p) + '\r\n';
  if(p.e) v += 'EMAIL;TYPE=WORK:' + esc(p.e) + '\r\n';
  (p.links||[]).forEach(l => { if(l.u) v += 'URL:' + l.u + '\r\n'; });
  v += 'END:VCARD\r\n';
  return v;
}

function render(p){
  document.getElementById('avatar').textContent = initials(p.n);
  const nameEl = document.getElementById('name');
  nameEl.textContent = p.n || 'Sem nome';
  const role = [p.t, p.c].filter(Boolean).join(' · ');
  if(role){ const r = document.getElementById('role'); r.textContent = role; r.hidden = false; }
  if(p.l){ document.getElementById('loc').hidden = false; document.getElementById('locText').textContent = p.l; }

  const rows = document.getElementById('rows');
  if(p.p) rows.appendChild(row({icon:'phone', label:'Telefone', value:p.p, href:'tel:'+p.p}));
  if(p.e) rows.appendChild(row({icon:'email', label:'Email', value:p.e, href:'mailto:'+p.e}));
  (p.links||[]).forEach(l => {
    if(l.u) rows.appendChild(row({icon:iconFor(l.k), label:l.k||'Link', value:l.u.replace(/^https?:\/\//,''), href:normUrl(l.u)}));
  });

  document.getElementById('save').addEventListener('click', () => {
    const blob = new Blob([vcard(p)], {type:'text/vcard;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = ((p.n||'contacto').replace(/\s+/g,'_')) + '.vcf';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
  });

  document.getElementById('card').hidden = false;
}

(function(){
  try{
    const raw = (location.hash || '').replace(/^#/, '').replace(/^data=/, '');
    if(!raw) throw new Error('empty');
    const p = JSON.parse(b64urlDecode(raw));
    if(!p || (!p.n && !p.e && !p.p && !(p.links&&p.links.length))) throw new Error('blank');
    render(p);
  }catch(e){
    document.getElementById('empty').hidden = false;
  }
})();
</script>
</body>
</html>
